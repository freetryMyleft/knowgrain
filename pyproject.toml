[project]
name = "knowgrain"
version = "0.1.0"
description = "Local-first evidence-backed wiki with embedded LightRAG"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "lightrag-hku==1.5.7",
    "ollama>=0.5.4,<1",
    "pgvector>=0.4.2,<1",
    "pydantic-settings>=2.8,<3",
    "pypdf>=6.1,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "watchfiles>=1.3,<2",
]

[project.optional-dependencies]
openai-compatible = ["openai>=2,<4"]

[project.scripts]
knowgrain = "knowgrain.cli:main"
knowgrain-api = "knowgrain.server:main"
knowgrain-tokenizer = "knowgrain.tokenizer_cache:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowgrain"]

[tool.ruff]
line-length = 100
target-version = "py312"
